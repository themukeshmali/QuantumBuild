<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Console — Quantum Build</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #06060b;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.10;
            pointer-events: none;
        }
        .orb-1 { width: 500px; height: 500px; background: #d4003a; top: -200px; right: -100px; animation: drift 8s infinite ease-in-out; }
        .orb-2 { width: 350px; height: 350px; background: #7c3aed; bottom: -100px; left: -80px; animation: drift 11s infinite ease-in-out reverse; }
        @keyframes drift {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(24px,-24px); }
        }

        /* Grid */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(212,0,58,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212,0,58,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(15,15,26,0.95);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 52px 48px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 60px rgba(212,0,58,0.06);
            backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #d4003a, #e02020);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem; font-weight: 900; color: #fff;
            box-shadow: 0 0 20px rgba(212,0,58,0.4);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem; font-weight: 700;
            background: linear-gradient(135deg, #d4003a, #e05020);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .spinner-ring {
            width: 64px; height: 64px;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: #d4003a;
            border-radius: 50%;
            margin: 0 auto 28px;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem; font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.85rem;
            color: #5a5a72;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }

        .dot-pulse {
            display: inline-flex; gap: 6px;
        }
        .dot-pulse span {
            width: 6px; height: 6px;
            background: #d4003a;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
            font-size: 0.75rem;
            color: #55556a;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #d4003a; }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-bg"></div>

    <div class="card">
        <div class="logo">
            <div class="logo-icon">Q</div>
            <div class="logo-text">Quantum Build</div>
        </div>

        <div class="spinner-ring"></div>

        <h1>Admin Console</h1>
        <p>Connecting to the dashboard&hellip;</p>
        <div class="dot-pulse">
            <span></span><span></span><span></span>
        </div>

        <br>
        <a href="https://quantum-build-frontend.vercel.app/" onclick="if(window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'){this.href='../frontend/index.html'}" class="back-link">← Back to Store</a>
    </div>

    <script>
        (function () {
            var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            var target = isLocal
                ? window.location.origin + '/dashboard/index.html'
                : 'https://quantum-build-dashboard.vercel.app/';
            // Brief delay so the animated splash shows (UX polish)
            setTimeout(function () {
                window.location.replace(target);
            }, 1200);
        })();
    </script>
</body>

</html>
