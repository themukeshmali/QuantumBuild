<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new password for your Quantum Build account.">
    <title>Reset Password — Quantum Build</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">Q</div>
                <span>Quantum Build</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="pcs.html">Gaming PCs</a>
                <a href="parts.html">PC Parts</a>                <a href="builder.html">PC Builder</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-actions">
                <form class="nav-search" id="navSearch" onsubmit="handleNavSearch(event)" role="search">
                    <input type="search" class="nav-search-input" id="navSearchInput" placeholder="Search products…" autocomplete="off" aria-label="Search products">
                    <button type="submit" class="nav-search-btn" aria-label="Search">🔍</button>
                </form>
                <a href="cart.html" class="nav-cart" id="navCart">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <div class="nav-toggle" id="navToggle">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </nav>
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Auth Section -->
    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon">Q</div>
                    <span>Quantum Build</span>
                </a>
                <h1>New <span class="text-gradient">Password</span></h1>
                <p>Choose a strong password for your account.</p>
            </div>

            <div class="auth-alert" id="authAlert"></div>

            <div id="invalidToken" style="display:none; text-align:center; padding: 20px 0;">
                <div style="font-size: 2rem; margin-bottom: 12px;">⚠️</div>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">This reset link is invalid or has expired.</p>
                <a href="forgot-password.html" class="btn-auth" style="display:inline-flex; width:auto; padding: 12px 24px; text-decoration:none;">
                    Request New Link
                </a>
            </div>

            <form class="auth-form" id="resetForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <div class="form-input-wrap">
                        <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" required autocomplete="new-password" minlength="8">
                        <button type="button" class="password-toggle" id="pwToggle" aria-label="Toggle password">👁</button>
                    </div>
                    <span class="form-error" id="passwordError">Password must be at least 8 characters</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat new password" required autocomplete="new-password">
                    <span class="form-error" id="confirmError">Passwords do not match</span>
                </div>

                <!-- Password strength bar -->
                <div style="margin: -8px 0 16px;">
                    <div style="height:4px; background: var(--border-color, rgba(255,255,255,0.08)); border-radius: 4px; overflow:hidden;">
                        <div id="strengthBar" style="height:100%; width:0; border-radius:4px; transition: width 0.3s, background 0.3s;"></div>
                    </div>
                    <div id="strengthLabel" style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;"></div>
                </div>

                <button type="submit" class="btn-auth" id="submitBtn">
                    <span class="btn-text">Reset Password</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="login.html">← Back to Login</a></p>
            </div>
        </div>
    </section>

    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
