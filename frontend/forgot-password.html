<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Quantum Build account password. Enter your email to receive a secure reset link.">
    <title>Forgot Password — Quantum Build</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">Q</div>
                <span>Quantum Build</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="pcs.html">Gaming PCs</a>
                <a href="parts.html">PC Parts</a>                <a href="builder.html">PC Builder</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-actions">
                <form class="nav-search" id="navSearch" onsubmit="handleNavSearch(event)" role="search">
                    <input type="search" class="nav-search-input" id="navSearchInput" placeholder="Search products…" autocomplete="off" aria-label="Search products">
                    <button type="submit" class="nav-search-btn" aria-label="Search">🔍</button>
                </form>
                <a href="cart.html" class="nav-cart" id="navCart">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <div class="nav-toggle" id="navToggle">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </nav>
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Auth Section -->
    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon">Q</div>
                    <span>Quantum Build</span>
                </a>
                <h1>Forgot <span class="text-gradient">Password</span></h1>
                <p>Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <div class="auth-alert" id="authAlert"></div>

            <form class="auth-form" id="forgotForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                    <span class="form-error" id="emailError">Please enter a valid email</span>
                </div>

                <button type="submit" class="btn-auth" id="submitBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </section>

    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
